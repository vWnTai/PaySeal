services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payseal
      POSTGRES_USER: payseal
      POSTGRES_PASSWORD: payseal_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payseal -d payseal"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [payseal]

  minio:
    build:
      context: ./minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-payseal_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-payseal_minio_dev_secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"
    networks: [payseal]

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - signing_keys:/keys
    expose:
      - "8000"
    networks: [payseal]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on: [backend]
    expose:
      - "3000"
    networks: [payseal]

  frontend-test:
    profiles: [test]
    build:
      context: ./frontend
      target: test
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    networks: [payseal]

  nginx:
    image: nginx:1.27-alpine
    depends_on: [backend, frontend]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports:
      - "3000:3000"
      - "8000:8000"
    networks: [payseal]

volumes:
  postgres_data:
  minio_data:
  signing_keys:

networks:
  payseal:
    driver: bridge


name: payseal-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: payseal
      POSTGRES_USER: payseal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure a private production database password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payseal -d payseal"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [payseal]

  minio:
    build:
      context: ./minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Configure a production storage user}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Configure a private production storage password}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes: ["minio_data:/data"]
    networks: [payseal]

  backend:
    build: ./backend
    image: payseal-production-backend
    restart: unless-stopped
    env_file: ${PAYSEAL_ENV_FILE:-.env.production}
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes: ["signing_keys:/keys"]
    networks: [payseal]

  reconciliation:
    image: payseal-production-backend
    restart: unless-stopped
    command: ["python", "-m", "app.reconcile_worker", "--interval", "60"]
    env_file: ${PAYSEAL_ENV_FILE:-.env.production}
    depends_on:
      backend: { condition: service_healthy }
    volumes: ["signing_keys:/keys:ro"]
    networks: [payseal]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      backend: { condition: service_healthy }
    networks: [payseal]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PAYSEAL_DOMAIN: ${PAYSEAL_DOMAIN:?Configure the public production domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [backend, frontend]
    networks: [payseal]

volumes:
  postgres_data:
  minio_data:
  signing_keys:
  caddy_data:
  caddy_config:

networks:
  payseal:
    driver: bridge

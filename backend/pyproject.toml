[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payseal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=44,<46",
  "pyotp>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "minio>=7.2,<8",
  "reportlab>=4.2,<5",
  "qrcode[pil]>=8,<9",
  "payos==1.1.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "httpx>=0.28,<1"]
dev = ["ruff>=0.16,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

